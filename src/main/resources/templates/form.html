<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Personaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Formulario de Personaje</h2>
    <form th:action="@{/guardar}" th:object="${persona}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" th:field="*{apellido}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Ciudad de Origen</label>
            <select th:field="*{ciudadOrigen.id}" class="form-select" required>
                <option value="">-- Selecciona una ciudad --</option>
                <option th:each="c : ${ciudades}" 
                        th:value="${c.id}" 
                        th:text="${c.nombre + ' (' + c.estado + ')'}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
